appId: com.textileshop.management
productName: Textile Shop Management System
artifactName: TextileShopSetup.exe
publish: null

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

win:
  target: nsis
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Textile Shop System
  artifactName: TextileShopSetup.exe
