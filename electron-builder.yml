appId: com.textileshop.management
productName: Textile Shop Management System
artifactName: TextileShopSetup.exe
publish: null

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

win:
  target: nsis
  icon: public/icon.png
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Textile Shop System
  artifactName: TextileShopSetup.exe
